name: Validate escreg

on:
  workflow_call:

jobs:
  validate:
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: "**/package-lock.json"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install algokit
        run: pipx install algokit

      - name: Start LocalNet
        run: algokit localnet start

      - name: Install dependencies
        # npm workspace root covers projects/*; `algokit project bootstrap all` prompts
        # for a package manager on the lockfile-less sub-projects and aborts without a TTY
        run: npm ci

      - name: Configure git
        shell: bash
        run: |
          # set git user and email as test invoke git
          git config --global user.email "actions@github.com" && git config --global user.name "github-actions"


      - name: Audit dependencies
        run: algokit project run audit



      - name: Lint and format
        run: algokit project run lint



      - name: Build contracts, SDK, client and worker
        run: algokit project run build

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          algokit project run test

      - name: Scan TEAL files for issues
        run: algokit project run audit-teal

      # # Uncomment to enable TEAL static analysis with snapshoting using Tealer package
      # # Would first require running locally using audit-teal command and committing the snapshots into source control
      # # Please note, tealer has a known bug that may result in large snapshot file sizes, track resolution here:
      # # https://github.com/crytic/tealer/issues/101
      # - name: Check output stability of the smart contracts
      #   run: algokit project run ci-teal-diff

      # No LocalNet deploy smoke test: deploy-config.ts pins `existingDeployments` to the fnet
      # registry's creator, so a deploy as any other account is rejected before it starts. Guarding
      # that on the deployer's address would make this step viable again.
