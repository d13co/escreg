[algokit]
min_version = "v2.6.0"

[project]
type = 'backend'
name = 'ts-sdk'

[project.run]
# Commands intended for use locally and in CI
build = { commands = [
  'npm run build',
], description = 'Build the SDK' }

test = { commands = [
  'npm run test',
], description = 'Run the SDK unit tests using vitest' }
