[algokit]
min_version = "v2.6.0"

[project]
type = 'backend'
name = 'client'

[project.run]
# Commands intended for use locally and in CI
# type-check and compile only: packaging the standalone executables needs bun, and is a release
# concern rather than something every CI run should pay for
build = { commands = [
  'npm run build:ts',
], description = 'Build the client' }

test = { commands = [
  'npm run test:run',
], description = 'Run the client tests using vitest' }
